<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>SayItToMe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      .pulse {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: linear-gradient(135deg, #5f58ff, #a855f7);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.75;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="pulse" aria-hidden="true"></div>
    <script>
      window.location.replace("https://sayittome-app.web.app/");
    </script>
  </body>
</html>
